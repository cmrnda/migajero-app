<div class="relative min-h-screen overflow-hidden bg-gradient-to-br from-slate-50 via-white to-brand-50">
  <div class="pointer-events-none absolute inset-0">
    <div class="absolute -top-32 -left-24 h-80 w-80 rounded-full bg-brand-400/25 blur-3xl motion-safe:animate-pulse"></div>
    <div class="absolute -bottom-32 -right-24 h-96 w-96 rounded-full bg-brand-600/15 blur-3xl motion-safe:animate-pulse"></div>
    <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_top,rgba(124,90,237,0.10),transparent_55%)]"></div>
  </div>

  <header class="relative border-b border-slate-200/60 bg-white/70 backdrop-blur-xl">
    <div class="mx-auto max-w-3xl px-4 py-4 flex items-center justify-between">
      <div class="font-extrabold text-slate-900">Resultado</div>
      <a
        routerLink="/"
        class="rounded-2xl border border-slate-200 bg-white px-4 py-2 text-sm font-semibold text-slate-700
               transition hover:text-brand-700 hover:border-brand-300"
      >
        Dashboard
      </a>
    </div>
  </header>

  <main class="relative mx-auto max-w-3xl px-4 py-8">
    <div *ngIf="loading" class="rounded-3xl bg-white/75 backdrop-blur-xl shadow-2xl ring-1 ring-slate-200 p-8 text-slate-600">
      Cargando tu último resultado…
    </div>

    <div *ngIf="!loading && errorMsg" class="rounded-3xl border border-rose-200 bg-rose-50 p-6">
      <div class="font-bold text-rose-900">Error</div>
      <div class="text-rose-900/80 mt-1 text-sm">{{ errorMsg }}</div>
      <button class="mt-4 rounded-2xl border border-rose-200 bg-white px-4 py-2 text-sm font-semibold text-rose-900" (click)="redoTest()">
        Ir al test
      </button>
    </div>

    <div *ngIf="!loading && result" class="space-y-4">
      <div id="resultCard" class="rounded-3xl bg-white/75 backdrop-blur-xl shadow-2xl ring-1 ring-slate-200 p-8">
        <div class="text-sm text-slate-500">Tu resultado</div>
        <div class="text-5xl font-black mt-2 text-brand-700">{{ result.score }}%</div>
        <div class="text-xl font-extrabold mt-2 text-slate-900">{{ result.level }}</div>
        <div class="mt-3 text-slate-700">{{ (result.tags || []).join(' · ') }}</div>

        <div class="mt-4 p-4 rounded-2xl bg-slate-50 text-slate-800">
          {{ result.comment || 'IA pendiente (Bedrock entra después)' }}
        </div>

        <div class="mt-4 text-xs text-slate-500">
          Solo entretenimiento. No es diagnóstico psicológico.
        </div>
      </div>

      <div class="flex gap-2">
        <button
          type="button"
          class="flex-1 rounded-2xl px-6 py-3 text-sm font-semibold text-white
                 bg-gradient-to-r from-brand-600 to-brand-500 shadow-lg shadow-brand-500/20
                 transition hover:brightness-110 active:scale-[0.99]"
          (click)="shareImage()"
        >
          Compartir imagen
        </button>

        <button
          type="button"
          class="flex-1 rounded-2xl border border-slate-200 bg-white px-5 py-3 text-sm font-semibold text-slate-700
                 transition hover:text-brand-700 hover:border-brand-300"
          (click)="downloadImage()"
        >
          Descargar
        </button>
      </div>

      <button
        type="button"
        class="w-full rounded-2xl border border-slate-200 bg-white px-5 py-3 text-sm font-semibold text-slate-700
               transition hover:text-brand-700 hover:border-brand-300"
        (click)="redoTest()"
      >
        Rehacer test
      </button>
    </div>
  </main>
</div>
