<div *ngIf="errorMsg" class="mb-4 rounded-2xl border border-rose-200 bg-rose-50 p-4">
  <div class="font-semibold text-rose-900">Error</div>
  <div class="text-sm text-rose-900/80 mt-1">{{ errorMsg }}</div>
</div>

<div *ngIf="lastResult" class="mb-4 rounded-2xl border border-emerald-200 bg-emerald-50 p-4">
  <div class="font-semibold text-emerald-900">Ya tienes un resultado guardado ✅</div>
  <div class="mt-1 text-sm text-emerald-900/80">
    Último: <span class="font-semibold">{{ lastResult.score }}%</span> · {{ lastResult.level }}
  </div>

  <button
    type="button"
    class="mt-3 rounded-2xl px-4 py-2 text-sm font-semibold text-white
           bg-gradient-to-r from-emerald-600 to-emerald-500 shadow-lg shadow-emerald-500/20
           transition hover:brightness-110 active:scale-[0.99]"
    (click)="goLastResult()"
  >
    Ver mi último resultado
  </button>
</div>

<div class="relative min-h-screen overflow-hidden bg-gradient-to-br from-slate-50 via-white to-brand-50">
  <div class="pointer-events-none absolute inset-0">
    <div class="absolute -top-32 -left-24 h-80 w-80 rounded-full bg-brand-400/25 blur-3xl motion-safe:animate-pulse"></div>
    <div class="absolute -bottom-32 -right-24 h-96 w-96 rounded-full bg-brand-600/15 blur-3xl motion-safe:animate-pulse"></div>
    <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_top,rgba(124,90,237,0.10),transparent_55%)]"></div>
  </div>

  <header class="relative border-b border-slate-200/60 bg-white/70 backdrop-blur-xl">
    <div class="mx-auto max-w-3xl px-4 py-4 flex items-center justify-between">
      <div class="font-extrabold text-slate-900">Solitario</div>
      <a
        routerLink="/"
        class="rounded-2xl border border-slate-200 bg-white px-4 py-2 text-sm font-semibold text-slate-700
               transition hover:text-brand-700 hover:border-brand-300"
      >
        Salir
      </a>
    </div>
  </header>

  <main class="relative mx-auto max-w-3xl px-4 py-8">
    <div *ngIf="loading" class="text-slate-500">Cargando test…</div>

    <div *ngIf="!loading && quiz" class="rounded-3xl bg-white/75 backdrop-blur-xl shadow-2xl ring-1 ring-slate-200 p-8">
      <div class="flex items-center justify-between text-sm text-slate-500">
        <div>Pregunta {{ idx + 1 }} / {{ quiz.questions.length }}</div>
        <div>{{ quiz.version }}</div>
      </div>

      <div class="mt-4 text-xl font-extrabold text-slate-900">{{ q?.text }}</div>

      <div class="mt-5 space-y-3">
        <button
          *ngFor="let o of q?.options"
          type="button"
          class="w-full text-left rounded-2xl border px-4 py-4 transition
                 hover:-translate-y-[1px] hover:shadow-md
                 focus:outline-none focus:ring-4 focus:ring-brand-100"
          [class.border-brand-400]="isSelected(o.id)"
          [class.bg-brand-50]="isSelected(o.id)"
          [class.border-slate-200]="!isSelected(o.id)"
          [class.bg-white]="!isSelected(o.id)"
          (click)="select(o)"
        >
          {{ o.text }}
        </button>
      </div>

      <div class="mt-6 flex gap-2">
        <button
          type="button"
          class="rounded-2xl border border-slate-200 bg-white px-5 py-3 text-sm font-semibold text-slate-700 transition
                 hover:text-brand-700 hover:border-brand-300 disabled:opacity-40"
          (click)="prev()"
          [disabled]="idx === 0"
        >
          Atrás
        </button>

        <button
          *ngIf="idx < quiz.questions.length - 1"
          type="button"
          class="flex-1 rounded-2xl px-6 py-3 text-sm font-semibold text-white
                 bg-gradient-to-r from-brand-600 to-brand-500 shadow-lg shadow-brand-500/20
                 transition hover:brightness-110 active:scale-[0.99] disabled:opacity-60"
          (click)="next()"
          [disabled]="!canNext()"
        >
          Siguiente
        </button>

        <button
          *ngIf="idx === quiz.questions.length - 1"
          type="button"
          class="flex-1 rounded-2xl px-6 py-3 text-sm font-semibold text-white
                 bg-gradient-to-r from-brand-600 to-brand-500 shadow-lg shadow-brand-500/20
                 transition hover:brightness-110 active:scale-[0.99] disabled:opacity-60"
          (click)="submit()"
          [disabled]="!canSubmit()"
        >
          Ver resultado
        </button>
      </div>

      <div class="mt-4 text-xs text-slate-500">{{ quiz.disclaimer }}</div>
    </div>
  </main>
</div>
