<div class="relative min-h-screen overflow-hidden bg-gradient-to-br from-slate-50 via-white to-brand-50">
  <!-- Background blobs -->
  <div class="pointer-events-none absolute inset-0">
    <div
      class="absolute -top-32 -left-24 h-80 w-80 rounded-full bg-brand-400/25 blur-3xl
             motion-safe:animate-pulse"
    ></div>
    <div
      class="absolute -bottom-32 -right-24 h-96 w-96 rounded-full bg-brand-600/15 blur-3xl
             motion-safe:animate-pulse"
    ></div>
    <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_top,rgba(124,90,237,0.10),transparent_55%)]"></div>
  </div>

  <div class="relative flex min-h-screen items-center justify-center p-4">
    <div class="w-full max-w-md">
      <!-- Card -->
      <div
        class="group relative rounded-3xl bg-white/75 backdrop-blur-xl
               shadow-2xl ring-1 ring-slate-200
               transition-all duration-300 ease-out
               hover:-translate-y-1 hover:shadow-[0_20px_60px_-25px_rgba(15,23,42,0.35)]"
      >
        <!-- Top accent -->
        <div class="h-2 w-full rounded-t-3xl bg-gradient-to-r from-brand-500 via-brand-600 to-brand-700"></div>

        <div class="p-8">
          <!-- Header -->
          <div class="mb-6">
            <div class="inline-flex items-center gap-2 rounded-full bg-brand-50 px-3 py-1 text-xs font-semibold text-brand-700 ring-1 ring-brand-200">
              <span class="h-2 w-2 rounded-full bg-brand-500"></span>
              Cuenta nueva
            </div>

            <h1 class="mt-4 text-2xl font-extrabold tracking-tight text-slate-900">
              Crear cuenta
            </h1>
            <p class="mt-2 text-sm leading-relaxed text-slate-600">
              Guarda tu resultado y compártelo sin rehacer el test.
            </p>
          </div>

          <form class="space-y-4" [formGroup]="form" (ngSubmit)="onSubmit()">
            <!-- Nickname -->
            <div class="space-y-2">
              <label class="text-sm font-medium text-slate-700">Apodo</label>

              <div
                class="flex items-center gap-3 rounded-2xl border border-slate-200 bg-white px-4 py-3
                       ring-0 transition
                       focus-within:border-brand-400 focus-within:ring-4 focus-within:ring-brand-100"
              >
                <svg class="h-5 w-5 text-slate-400" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                  <path d="M12 12a4 4 0 1 0-4-4 4 4 0 0 0 4 4Z" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
                  <path d="M4 20a8 8 0 0 1 16 0" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
                </svg>

                <input
                  class="w-full bg-transparent text-slate-900 placeholder-slate-400 outline-none"
                  formControlName="nickname"
                  placeholder="Ej: Genex"
                  autocomplete="nickname"
                />
              </div>

              <p *ngIf="form.get('nickname')?.touched && form.get('nickname')?.invalid" class="text-xs text-red-600">
                Este campo es obligatorio.
              </p>
            </div>

            <!-- Email -->
            <div class="space-y-2">
              <label class="text-sm font-medium text-slate-700">Correo</label>

              <div
                class="flex items-center gap-3 rounded-2xl border border-slate-200 bg-white px-4 py-3
                       ring-0 transition
                       focus-within:border-brand-400 focus-within:ring-4 focus-within:ring-brand-100"
              >
                <svg class="h-5 w-5 text-slate-400" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                  <path d="M4 7.5l8 5 8-5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
                  <path d="M4 7.5V17a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
                </svg>

                <input
                  class="w-full bg-transparent text-slate-900 placeholder-slate-400 outline-none"
                  type="email"
                  formControlName="email"
                  placeholder="tu@correo.com"
                  autocomplete="email"
                  inputmode="email"
                />
              </div>

              <p *ngIf="form.get('email')?.touched && form.get('email')?.invalid" class="text-xs text-red-600">
                Ingresa un correo válido.
              </p>
            </div>

            <!-- Password -->
            <div class="space-y-2">
              <label class="text-sm font-medium text-slate-700">Contraseña</label>

              <div
                class="flex items-center gap-3 rounded-2xl border border-slate-200 bg-white px-4 py-3
                       ring-0 transition
                       focus-within:border-brand-400 focus-within:ring-4 focus-within:ring-brand-100"
              >
                <svg class="h-5 w-5 text-slate-400" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                  <path d="M7.5 11V8.8a4.5 4.5 0 1 1 9 0V11" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
                  <path d="M7 11h10a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
                </svg>

                <input
                  class="w-full bg-transparent text-slate-900 placeholder-slate-400 outline-none"
                  [type]="showPassword ? 'text' : 'password'"
                  formControlName="password"
                  placeholder="********"
                  autocomplete="new-password"
                />

                <!-- Ojito -->
                <button
                  type="button"
                  class="rounded-xl p-2 text-slate-500 transition hover:text-brand-700
                         focus:outline-none focus:ring-4 focus:ring-brand-100"
                  (click)="showPassword = !showPassword"
                  [attr.aria-label]="showPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'"
                  [attr.aria-pressed]="showPassword"
                >
                  <!-- Ojo abierto -->
                  <svg *ngIf="!showPassword" class="h-5 w-5" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <path d="M2.5 12s3.5-7 9.5-7 9.5 7 9.5 7-3.5 7-9.5 7-9.5-7-9.5-7Z"
                          stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"
                          stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
                  </svg>

                  <!-- Ojo tachado -->
                  <svg *ngIf="showPassword" class="h-5 w-5" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <path d="M3 3l18 18" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
                    <path d="M10.5 10.5A3 3 0 0 0 12 15a3 3 0 0 0 2.12-.88"
                          stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M6.6 6.6C4.2 8.2 2.5 12 2.5 12s3.5 7 9.5 7c1.7 0 3.2-.4 4.5-1.1"
                          stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M9.2 5.3A10 10 0 0 1 12 5c6 0 9.5 7 9.5 7a15.7 15.7 0 0 1-3.1 4.4"
                          stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
                  </svg>
                </button>
              </div>

              <p class="text-xs text-slate-500">Mínimo 8 caracteres.</p>

              <p *ngIf="form.get('password')?.touched && form.get('password')?.invalid" class="text-xs text-red-600">
                <span *ngIf="form.get('password')?.errors?.['required']">La contraseña es obligatoria.</span>
                <span *ngIf="form.get('password')?.errors?.['minlength']">Mínimo 8 caracteres.</span>
              </p>
            </div>

            <!-- Button -->
            <button
              class="relative w-full overflow-hidden rounded-2xl px-4 py-3 text-sm font-semibold text-white
                     bg-gradient-to-r from-brand-600 to-brand-500
                     shadow-lg shadow-brand-500/20
                     transition duration-200 ease-out
                     hover:brightness-110 active:scale-[0.99]
                     focus:outline-none focus:ring-4 focus:ring-brand-200
                     disabled:cursor-not-allowed disabled:opacity-60"
              type="submit"
              [disabled]="auth.isLoading() || form.invalid"
            >
              <span class="inline-flex items-center justify-center gap-2">
                <span
                  *ngIf="auth.isLoading()"
                  class="h-4 w-4 animate-spin rounded-full border-2 border-white/40 border-t-white"
                  aria-hidden="true"
                ></span>
                {{ auth.isLoading() ? 'Creando...' : 'Crear cuenta' }}
              </span>

              <!-- shine on hover -->
              <span
                class="pointer-events-none absolute -left-16 top-0 h-full w-16 -skew-x-12 bg-white/20 opacity-0
                       transition duration-300 group-hover:translate-x-[520px] group-hover:opacity-100"
              ></span>
            </button>

            <!-- Error backend -->
            <div *ngIf="auth.errorEs()" class="rounded-2xl border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700">
              {{ auth.errorEs() }}
            </div>

            <!-- Link -->
            <p class="pt-1 text-sm text-slate-600">
              ¿Ya tienes cuenta?
              <a class="font-semibold text-brand-700 transition hover:text-brand-800" routerLink="/auth/sign-in">
                Inicia sesión
              </a>
            </p>

            <!-- Footer -->
            <div class="pt-4 text-center text-xs text-slate-500">
              <span class="inline-flex items-center gap-2">
                <span class="h-1.5 w-1.5 rounded-full bg-brand-500"></span>
                <span class="font-semibold text-brand-700">AWS CLOUD CLUBS UMSA</span>
              </span>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
