<div class="min-h-screen flex items-center justify-center p-4 bg-slate-50">
  <div class="card w-full max-w-md p-6">
    <h1 class="text-2xl font-bold">Confirmar cuenta</h1>
    <p class="text-slate-600 mt-1">Te enviamos un código a <span class="font-semibold">{{ email }}</span>.</p>

    <form class="mt-5 space-y-3" [formGroup]="form" (ngSubmit)="onSubmit()">
      <label class="block">
        <span class="text-sm text-slate-700">Código</span>
        <input class="mt-1 w-full rounded-xl border border-brand/25 p-3 focus:outline-none focus:shadow-brand"
               formControlName="code" placeholder="123456" />
      </label>

      <button class="btn-primary w-full" type="submit" [disabled]="auth.isLoading() || form.invalid">
        {{ auth.isLoading() ? 'Confirmando...' : 'Confirmar' }}
      </button>

      <p *ngIf="auth.errorEs()" class="text-sm text-red-600">{{ auth.errorEs() }}</p>

      <a class="text-sm text-brand font-semibold" routerLink="/auth/sign-in">Volver al login</a>
    </form>
  </div>
</div>
